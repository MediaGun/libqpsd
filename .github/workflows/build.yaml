name: Build library
run-name: Build library by ${{ github.actor }}

on:
  push:
    branches:
      - master
      - test
      - qt-6.8
      - qt-6.12
    tags:
      - 'v*'
      - 'qt-*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read
  packages: write

env:
  qt_version: 6.12.0

jobs:
  build_linux:
    name: Build for Linux
    runs-on: [ ubuntu-24.04 ]
    # The maximum for GitHub-hosted runners.
    timeout-minutes: 360

    env:
      build_dir: './build'
      install_prefix: '${{ github.workspace }}/install_linux'
      libs_dir: '${{ github.workspace }}/libs_deps'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install libs
        run: |
          sudo apt-get install ninja-build

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.qt_version }}
          dir: ${{ github.workspace }}
          tools: 'tools_ninja'

      - name: Configure
        env:
          DESTDIR: ${{ env.install_prefix }}
        run: |
          cmake -S . -B ${{ env.build_dir }} -GNinja -DCMAKE_BUILD_TYPE:STRING=Release

      - name: Build
        run: cmake --build ${{ env.build_dir }}

      - name: Install
        run: cmake --install ${{ env.build_dir }}

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: libqpsd-linux
          path: ${{ env.install_prefix }}

  build_windows:
    name: Build for Windows
    runs-on: [ windows-2022 ]
    # The maximum for GitHub-hosted runners.
    timeout-minutes: 360

    env:
      build_dir: './build'
      install_prefix: '${{ github.workspace }}/install_windows'
      libs_dir: '${{ github.workspace }}/libs_deps'
      qt_dir: ${{ github.workspace }}
      qt_tools_dir: ${{ github.workspace }}/Qt/Tools

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # The runner's MSVC (cl.exe and its environment), whatever toolset version the image has.
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.qt_version }}
          arch: 'win64_msvc2022_64'
          dir: ${{ github.workspace }}
          tools: 'tools_ninja'
          add-tools-to-path: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure
        env:
          DESTDIR: ${{ env.install_prefix }}
        run: |
          cmake -S . -B ${{ env.build_dir }} -GNinja -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER=cl -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_INSTALL_PREFIX="${{ env.install_prefix }}"
        shell: cmd

      - name: Build
        run: |
          cmake --build ${{ env.build_dir }}
        shell: cmd

      - name: Install
        run: |
          cmake --install ${{ env.build_dir }}
        shell: cmd

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: libqpsd-windows
          path: ${{ env.install_prefix }}

  build_macos:
    name: Build for MacOS
    runs-on: [ macos-26 ]
    # The maximum for GitHub-hosted runners.
    timeout-minutes: 360

    env:
      build_dir: './build'
      install_prefix: '${{ github.workspace }}/install_macos'
      libs_dir: '${{ github.workspace }}/libs_deps'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.qt_version }}
          dir: ${{ github.workspace }}
          tools: 'tools_ninja'

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure
        env:
          DESTDIR: ${{ env.install_prefix }}
        run: |
          cmake -S . -B ${{ env.build_dir }} -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_INSTALL_PREFIX=${{ env.install_prefix }}

      - name: Build
        run: cmake --build ${{ env.build_dir }}

      - name: Install
        run: cmake --install ${{ env.build_dir }}

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: libqpsd-macos
          path: ${{ env.install_prefix }}

  # On a tag (e.g. qt-6.12.0): a GitHub release with one zip per platform, laid out as the app's
  # build.yaml downloads them (plugins/imageformats/..., extracted into Qt).
  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [ build_linux, build_windows, build_macos ]
    runs-on: [ ubuntu-24.04 ]
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        working-directory: artifacts
        run: |
          for platform in linux windows macos; do
            (cd libqpsd-$platform && zip -r -y ../../libqpsd-$platform.zip .)
          done
          ls -la ..

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: libqpsd ${{ github.ref_name }} for Qt ${{ env.qt_version }}
          body: |
            The PSD image plugin, built against Qt ${{ env.qt_version }} for Linux, Windows and macOS.
          files: libqpsd-*.zip
